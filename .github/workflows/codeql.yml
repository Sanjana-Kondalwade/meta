name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to analyze (owner/name). Defaults to current repo.'
        required: false
        type: string
        default: ""
      branch:
        description: 'Branch to analyze. Defaults to current branch.'
        required: false
        default: ""
        type: string
      languages:
        description: 'CodeQL languages to analyze (e.g., python, c-cpp, javascript)'
        required: false
        type: string
        default: 'python'
      build-mode:
        description: 'CodeQL build mode (none, manual, autobuild)'
        required: false
        type: string
        default: 'none'
  workflow_call:
    inputs:
      repo:
        required: false
        type: string
        default: ""
      branch:
        required: false
        default: ""
        type: string
      languages:
        description: 'CodeQL languages to analyze (e.g., c-cpp, python, javascript)'
        required: false
        type: string
        default: 'c-cpp'
      build-mode:
        description: 'CodeQL build mode (none, manual, autobuild)'
        required: false
        type: string
        default: 'none'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Determine Repository and Branch
        id: repo-info
        run: |
          repo="${{ inputs.repo }}"
          if [ -z "${repo}" ]; then
            repo="${{ github.repository }}"
          fi
          branch="${{ inputs.branch }}"
          if [ -z "${branch}" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "pull_request_target" ]; then
              branch="${{ github.head_ref }}"
            else
              branch="${{ github.ref_name }}"
            fi
          fi
          echo "repo=${repo}" >> $GITHUB_OUTPUT
          echo "branch=${branch}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo-info.outputs.repo }}
          ref: ${{ steps.repo-info.outputs.branch }}

      - name: Download and setup metaport
        run: |
          sudo apt-get update
          sudo apt-get install -y pax ncompress curl
          # Clone meta to a directory outside the workspace to avoid scanning it
          git clone https://github.com/zopencommunity/meta.git /tmp/meta
          # Create symlink in workspace for build process
          ln -s /tmp/meta meta
          echo "Metaport setup completed"

      - name: Create CodeQL config
        run: |
          mkdir -p .github/codeql
          cat > .github/codeql/codeql-config.yml << 'EOF'
          name: "CodeQL Config"

          paths-ignore:
            - meta/**
            - '**/meta/**'
            - '**/test-*.c'
            - '**/test-*.cpp'
            - '**/test-*.h'
            - '**/test-*.hpp'
            - '**/*-tests/**'
            - '**/tests/**'
            - '**/testsuite/**'

          queries:
            - uses: security-extended
          EOF
          echo "CodeQL config created"

      - name: Fetch upstream source with zopen
        if: ${{ hashFiles('buildenv') != '' }}
        run: |
          export PATH="$PWD/meta/bin:$PATH"
          git config --global user.email "zopenCommunity@ibm.com"
          git config --global user.name "Zopen Community"
          zopen build -g
          ls -lrt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages || 'python' }}
          build-mode: ${{ inputs.build-mode || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results

      - name: Upload SARIF as artifact
        id: upload_sarif
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ inputs.languages || 'python' }}
          path: sarif-results/
          if-no-files-found: warn

      - name: Parse SARIF findings
        id: parse_sarif
        if: always()
        run: |
          SARIF_FILE=$(find sarif-results/ -name '*.sarif' 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "total=0"            >> "$GITHUB_OUTPUT"
            echo "error=0"           >> "$GITHUB_OUTPUT"
            echo "warning=0"         >> "$GITHUB_OUTPUT"
            echo "sarif_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sarif_found=true" >> "$GITHUB_OUTPUT"
          python3 << PYEOF
          import json, os

          sarif_path  = "$SARIF_FILE"
          output_path = os.environ["GITHUB_OUTPUT"]

          with open(sarif_path) as f:
              sarif = json.load(f)

          # Only count error (critical/high) and warning (medium); skip note (low)
          counts = {"error": 0, "warning": 0}
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "warning")
                  if level in counts:
                      counts[level] += 1
                  # note and unknown levels are intentionally ignored

          total = sum(counts.values())
          with open(output_path, "a") as out:
              out.write(f"total={total}\n")
              out.write(f"error={counts['error']}\n")
              out.write(f"warning={counts['warning']}\n")
          PYEOF

      - name: Copilot Analysis of findings
        id: copilot_analysis
        if: ${{ steps.parse_sarif.outputs.sarif_found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SARIF_FILE=$(find sarif-results/ -name '*.sarif' 2>/dev/null | head -n 1)
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          sarif_path = os.popen("find sarif-results/ -name '*.sarif' 2>/dev/null | head -n 1").read().strip()
          gh_token   = os.environ["GH_TOKEN"]
          workspace  = os.environ.get("GITHUB_WORKSPACE", ".")
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          with open(sarif_path) as f:
              sarif = json.load(f)

          # Collect up to 5 error-level findings with source context
          findings = []
          for run in sarif.get("runs", []):
              rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  if result.get("level") != "error":
                      continue
                  locs = result.get("locations", [])
                  if not locs:
                      continue
                  loc   = locs[0].get("physicalLocation", {})
                  fpath = loc.get("artifactLocation", {}).get("uri", "")
                  region = loc.get("region", {})
                  start  = region.get("startLine", 1)
                  rule_id = result.get("ruleId", "")
                  rule_obj = rules.get(rule_id, {})
                  message = result.get("message", {}).get("text", "")
                  description = (rule_obj.get("fullDescription") or rule_obj.get("shortDescription") or {}).get("text", "")

                  # Read ±10 lines of source context
                  abs_path = os.path.join(workspace, fpath)
                  snippet = ""
                  try:
                      with open(abs_path) as sf:
                          lines = sf.readlines()
                      lo = max(0, start - 11)
                      hi = min(len(lines), start + 10)
                      numbered = [f"{lo+i+1}: {lines[lo+i].rstrip()}" for i in range(hi - lo)]
                      snippet = "\n".join(numbered)
                  except Exception:
                      snippet = "(source not readable)"

                  findings.append({
                      "rule_id": rule_id,
                      "message": message,
                      "description": description,
                      "file": fpath,
                      "line": start,
                      "snippet": snippet,
                  })
                  if len(findings) >= 5:
                      break
              if len(findings) >= 5:
                  break

          if not findings:
              with open(summary_path, "a") as out:
                  out.write("\n## Copilot Analysis\n\nNo error-level findings to analyse.\n")
              raise SystemExit(0)

          # Call GitHub Models API (gpt-4o) for each finding
          api_url = "https://models.inference.ai.azure.com/chat/completions"
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {gh_token}",
          }

          analyses = []
          for f in findings:
              prompt = (
                  f"You are a security code reviewer.\n"
                  f"CodeQL rule `{f['rule_id']}` fired on `{f['file']}` line {f['line']}.\n"
                  f"Rule description: {f['description']}\n"
                  f"Alert message: {f['message']}\n\n"
                  f"Source context (lines around the finding):\n```c\n{f['snippet']}\n```\n\n"
                  f"In 3-5 sentences: explain exactly what is wrong at that line, "
                  f"why it is a security risk, and give a concrete one-line code fix."
              )
              body = json.dumps({
                  "model": "gpt-4o",
                  "messages": [{"role": "user", "content": prompt}],
                  "max_tokens": 300,
                  "temperature": 0.2,
              }).encode()

              try:
                  req = urllib.request.Request(api_url, data=body, headers=headers, method="POST")
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
                  analysis_text = data["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  analysis_text = f"_(Analysis unavailable: {e})_"

              analyses.append((f, analysis_text))

          # Write to job summary
          with open(summary_path, "a") as out:
              out.write("\n## Copilot Analysis (top error-level findings)\n\n")
              for f, analysis in analyses:
                  out.write(f"### `{f['rule_id']}` — {f['file']}:{f['line']}\n\n")
                  out.write(f"**Alert:** {f['message']}\n\n")
                  out.write(f"{analysis}\n\n")
                  out.write("---\n\n")
          PYEOF

      - name: Create Job Summary
        if: always()
        run: |
          LANGUAGE="${{ inputs.languages || 'python' }}"
          OUTCOME="${{ steps.codeql_analyze.outcome }}"
          TOTAL="${{ steps.parse_sarif.outputs.total }}"
          ERRORS="${{ steps.parse_sarif.outputs.error }}"
          WARNINGS="${{ steps.parse_sarif.outputs.warning }}"
          SARIF_FOUND="${{ steps.parse_sarif.outputs.sarif_found }}"

          if [ "$OUTCOME" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          {
            echo "# CodeQL Analysis Results"
            echo ""
            echo "## Execution Status: ${STATUS}"
            echo ""
            echo "## Configuration"
            echo ""
            echo "| Setting  | Value |"
            echo "|----------|-------|"
            echo "| Language | \`${LANGUAGE}\` |"
            echo "| Queries  | \`security-extended\` |"
            echo "| Runner   | \`${{ runner.os }}-${{ runner.arch }}\` |"
            echo "| Trigger  | \`${{ github.event_name }}\` |"
            echo ""
            echo "## Findings (Critical/High/Medium only)"
            echo ""
            if [ "$SARIF_FOUND" = "true" ]; then
              echo "| Severity        | Count |"
              echo "|-----------------|------:|"
              echo "| Error (High+)   | ${ERRORS} |"
              echo "| Warning (Medium)| ${WARNINGS} |"
              echo "| **Total**       | **${TOTAL}** |"
            else
              echo "No SARIF results file found."
            fi
            echo ""
            echo "Full SARIF results available in artifacts: \`codeql-sarif-${LANGUAGE}\`"
            echo ""
            echo "---"
            echo "*Job summary generated at run-time*"
          } >> "$GITHUB_STEP_SUMMARY"
